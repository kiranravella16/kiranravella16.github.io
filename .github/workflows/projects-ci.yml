name: Projects CI
on:
  push:
    paths: ["projects/**", ".github/workflows/projects-ci.yml"]
  pull_request:
    paths: ["projects/**", ".github/workflows/projects-ci.yml"]
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cert-lifecycle-manager, bnpl-risk-engine, pii-vault]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: projects/${{ matrix.project }}/pom.xml
      - run: mvn -B verify

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/catalog-feed-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/catalog-feed-pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rag-knowledge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
